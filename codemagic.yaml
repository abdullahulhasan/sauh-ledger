# Codemagic CI/CD Config File for Sauh Ledger
# App name: Sauh Ledger
# Package name: com.sauhinc.sauhleger
# Platform: Android
# Build type: APK (Debug Mode)

workflows:
  android-debug-apk-build:
    name: Sauh Ledger (Android Debug APK)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        PACKAGE_NAME: "com.sauhinc.sauhleger"
        APP_NAME: "Sauh Ledger"
      node: latest
      java: 21
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true
    scripts:
      - name: Install Node package dependencies
        script: |
          npm install --no-audit --no-fund
      - name: Build React web production assets
        script: |
          npm run build
      - name: Sync React asset bundles with Capacitor Android project
        script: |
          npx cap sync android
      - name: Build Android Debug APK package via Gradle wrapper
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - abdullahulhasan@gmail.com
        notify:
          success: true
          failure: true
